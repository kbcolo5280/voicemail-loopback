spring.application.name=voicemail-loopback

# RingCentral OAuth App Credentials
rc.client-id=XTm0pdXZ3NZei3GAsxIRCp
rc.client-secret=WGON2ZG9anVbYtdsyvLBoo1HR85zXw6RefEN2GGtIb6H
rc.server-url=https://platform.ringcentral.com

# Must exactly match the Redirect URI registered in your RingCentral app settings
rc.redirect-uri=http://localhost:8081/oauth/callback

server.port=8081

# Optional: increase session timeout (in seconds)
server.servlet.session.timeout=3600

# ── Logging — reduce Railway log volume (500 logs/sec limit) ──────────────────
# Keep our own app logs at INFO; suppress noisy framework internals
logging.level.root=WARN
logging.level.com.voicemail.tracker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.com.ringcentral=WARN
logging.level.org.apache.http=WARN
logging.level.org.apache.tomcat=WARN
# Single-line log pattern — reduces log size per entry
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n
