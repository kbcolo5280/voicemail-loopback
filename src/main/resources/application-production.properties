# ── Production logging — keeps Railway under 500 logs/sec limit ───────────────
# Suppress noisy Spring/RC SDK framework internals; keep our own app logs
logging.level.root=WARN
logging.level.com.voicemail.tracker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot=WARN
logging.level.com.ringcentral=WARN
logging.level.org.apache.http=WARN
logging.level.org.apache.tomcat=WARN
# Single-line compact pattern reduces log bytes per entry
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n
